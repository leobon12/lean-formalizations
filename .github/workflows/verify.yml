name: Verify Lean proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-part-1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 20971520
      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Restore pinned dependency build cache
        uses: actions/cache@v4
        with:
          path: .lake/packages/**/.lake/build
          key: lean-build-verify-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-build-replay-${{ runner.os }}-
      - name: Download pinned Mathlib dependencies
        run: lake exe cache get
      - name: Compile the first part of the proof closure
        run: python3 scripts/verify.py --stop-after-minutes 230
      - name: Pass the first part to the second job
        uses: actions/upload-artifact@v4
        with:
          name: verification-part-1
          path: .lake/verification/
          retention-days: 3
  verify:
    needs: build-part-1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 20971520
      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Restore pinned dependency build cache
        uses: actions/cache@v4
        with:
          path: .lake/packages/**/.lake/build
          key: lean-build-verify-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-build-replay-${{ runner.os }}-
      - name: Download pinned Mathlib dependencies
        run: lake exe cache get
      - name: Restore the first part
        uses: actions/download-artifact@v4
        with:
          name: verification-part-1
          path: .lake/verification/
      - name: Verify the selected proof closure
        run: python3 scripts/verify.py --resume
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-log
          path: .lake/verification/
