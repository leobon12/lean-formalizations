name: Verify Lean proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Download pinned Mathlib dependencies
        run: lake exe cache get
      - name: Verify the selected proof closure
        run: python3 scripts/verify.py
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-log
          path: .lake/verification/
