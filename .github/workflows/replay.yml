name: Replay MatedCRTHarmonic kernel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 20971520
      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Restore pinned dependency build cache
        uses: actions/cache@v4
        with:
          path: .lake/packages/**/.lake/build
          key: lean-build-replay-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-build-verify-${{ runner.os }}-
      - name: Download pinned Mathlib dependencies
        run: lake exe cache get
      - name: Build the harmonic-functions library
        run: lake build MatedCRTHarmonic
      - name: Replay the library in the independent kernel
        run: lake env leanchecker --fresh MatedCRTHarmonic
